name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (leave empty to use project.conf)"
        required: false
        default: ""
        type: string
      publish_itch:
        description: "Push zip to itch.io"
        required: false
        default: true
        type: boolean
      publish_gh_release:
        description: "Create tag + GitHub Release assets"
        required: false
        default: true
        type: boolean
      build_platform:
        description: "all / macos / macos-c / macos-py / macos-intel / windows / windows-torch / windows-cuda / linux"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - macos
          - macos-c
          - macos-py
          - macos-intel
          - windows
          - windows-torch
          - windows-cuda
          - linux

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  ITCH_USER: nicapotato
  ITCH_GAME: demucs-app-dev
  PYTHON_VERSION: "3.12"

jobs:
  read-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      mac_flavors: ${{ steps.v.outputs.mac_flavors }}
    steps:
      - name: Block re-runs
        if: github.run_attempt != 1
        shell: bash
        run: |
          echo "::error::Re-runs are disabled (attempt ${{ github.run_attempt }}). Dispatch a new run instead." >&2
          exit 1

      - uses: actions/checkout@v4
      - id: v
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_PLATFORM: ${{ github.event.inputs.build_platform }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION}" ]; then
            V="${INPUT_VERSION}"
          else
            V=$(grep '^VERSION=' project.conf | cut -d= -f2 | tr -d '[:space:]')
          fi
          if [ -z "$V" ]; then
            echo "ERROR: empty version" >&2
            exit 1
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "tag=v${V}" >> "$GITHUB_OUTPUT"
          echo "Version: ${V} (tag v${V})"
          MLX_C='{"flavor":"mlx-c","app":"DemucsMlxCArmMacSilicon","zip":"demucs-mlx-c-arm-mac-silicon.zip","channel":"mlx-c-arm-mac-silicon"}'
          MLX_PY='{"flavor":"mlx-py","app":"DemucsMlxPyArmMacSilicon","zip":"demucs-mlx-py-arm-mac-silicon.zip","channel":"mlx-py-arm-mac-silicon"}'
          case "${INPUT_PLATFORM}" in
            all|macos) FLAVORS="[${MLX_C},${MLX_PY}]" ;;
            macos-c)   FLAVORS="[${MLX_C}]" ;;
            macos-py)  FLAVORS="[${MLX_PY}]" ;;
            *)         FLAVORS='[]' ;;
          esac
          echo "mac_flavors=${FLAVORS}" >> "$GITHUB_OUTPUT"
          echo "mac flavors: ${FLAVORS}"

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    needs: read-version
    if: needs.read-version.outputs.mac_flavors != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.read-version.outputs.mac_flavors) }}
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      VERSION: ${{ needs.read-version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      DMX_VARIANT: ${{ matrix.flavor }}
    steps:
      - name: Block re-runs
        if: github.run_attempt != 1
        shell: bash
        run: |
          echo "::error::Re-runs are disabled (attempt ${{ github.run_attempt }}). Dispatch a new run instead." >&2
          exit 1

      - name: Checkout demucs-ui-app
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Homebrew deps
        run: |
          set -euo pipefail
          brew install libvorbis libogg ffmpeg

      - name: Wire externals (raylib + checked-in prebuilt rocksmith-psarc)
        run: |
          set -euo pipefail
          chmod +x app/scripts/*.sh
          bash app/scripts/setup_externals.sh

      - name: Build GUI (CMake Release)
        run: make -C app build DMX_VARIANT="${{ matrix.flavor }}"

      - name: Smoke --version
        run: |
          set -euo pipefail
          BIN="app/build/${{ matrix.app }}"
          test -x "$BIN"
          "$BIN" --version
          "$BIN" --version | grep -F "${VERSION}"

      - name: Fetch prebuilt worker
        run: |
          set -euo pipefail
          bash app/scripts/fetch_mac_worker.sh "${{ matrix.flavor }}"

      - name: Bundle .app + zip
        run: |
          set -euo pipefail
          DMX_VARIANT="${{ matrix.flavor }}" bash app/scripts/build_app.sh
          test -f "app/dist/${{ matrix.zip }}"
          plutil -p "app/dist/${{ matrix.app }}.app/Contents/Info.plist" | grep -F "${VERSION}"

      - name: Smoke bundled app headless (5s tone -> 6 stems)
        run: |
          set -euo pipefail
          mkdir -p /tmp/dmx_ci_in /tmp/dmx_ci_out
          ffmpeg -y -hide_banner -loglevel error -f lavfi -i "sine=frequency=440:duration=5" \
            -ac 2 -ar 44100 /tmp/dmx_ci_in/tone5s.mp3
          "app/dist/${{ matrix.app }}.app/Contents/MacOS/${{ matrix.app }}" \
            --headless /tmp/dmx_ci_in/tone5s.mp3 --out /tmp/dmx_ci_out --mp3
          for s in drums bass other vocals guitar piano; do
            test -f "/tmp/dmx_ci_out/tone5s/${s}.mp3"
          done
          ls -la /tmp/dmx_ci_out/tone5s/

      - name: Prepare zip artifact
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp "app/dist/${{ matrix.zip }}" release-assets/
          (
            cd release-assets
            shasum -a 256 "${{ matrix.zip }}" | tee "${{ matrix.zip }}.sha256"
          )
          ls -la release-assets/

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: release-assets/*
          if-no-files-found: error

      - name: Setup butler
        if: github.event.inputs.publish_itch == 'true'
        uses: remarkablegames/setup-butler@v2
        with:
          butler-version: LATEST

      - name: Push to itch.io
        if: github.event.inputs.publish_itch == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BUTLER_API_KEY:-}" ]; then
            echo "ERROR: BUTLER_API_KEY secret is not set" >&2
            exit 1
          fi
          butler push "release-assets/${{ matrix.zip }}" \
            "${ITCH_USER}/${ITCH_GAME}:${{ matrix.channel }}" \
            --userversion "${VERSION}"
          echo "Pushed to itch.io ${ITCH_USER}/${ITCH_GAME}:${{ matrix.channel }} @ ${VERSION}"

  build-macos-intel:
    # Intel Mac ONNX app. Apple Silicon downloads stay mlx-c.
    runs-on: macos-15-intel
    timeout-minutes: 60
    needs: read-version
    if: contains(fromJSON('["macos-intel","all"]'), github.event.inputs.build_platform)
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      VERSION: ${{ needs.read-version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      DMX_VARIANT: onnx
    steps:
      - name: Block re-runs
        if: github.run_attempt != 1
        shell: bash
        run: |
          echo "::error::Re-runs are disabled (attempt ${{ github.run_attempt }}). Dispatch a new run instead." >&2
          exit 1

      - name: Checkout demucs-ui-app
        uses: actions/checkout@v4

      - name: Install Homebrew deps
        run: |
          set -euo pipefail
          brew install cmake ffmpeg

      - name: Build static libogg and libvorbis
        run: bash app/scripts/build_static_vorbis.sh

      - name: Wire externals (raylib + vgmstream source)
        run: |
          set -euo pipefail
          chmod +x app/scripts/*.sh
          bash app/scripts/vendor_vgmstream.sh
          bash app/scripts/setup_externals.sh

      - name: Build GUI (CMake Release)
        run: make -C app build DMX_VARIANT=onnx

      - name: Smoke --version
        run: |
          set -euo pipefail
          BIN="app/build/DemucsOnnxMac"
          test -x "$BIN"
          "$BIN" --version
          "$BIN" --version | grep -F "${VERSION}"

      - name: Fetch pinned ONNX worker
        run: |
          set -euo pipefail
          bash app/scripts/fetch_onnx_worker.sh mac-x64
          test -x app/dist/worker/demucs_onnx_worker/demucs_onnx_worker
          test -f app/models/htdemucs_6s_fp16weights.onnx

      - name: Bundle .app + zip
        run: |
          set -euo pipefail
          DMX_VARIANT=onnx bash app/scripts/build_app.sh
          test -f app/dist/demucs-onnx-mac-x64.zip
          plutil -p app/dist/DemucsOnnxMac.app/Contents/Info.plist | grep -F "${VERSION}"

      - name: Smoke bundled app headless (5s tone -> 6 stems)
        timeout-minutes: 30
        run: |
          set -euo pipefail
          mkdir -p /tmp/dmx_ci_in /tmp/dmx_ci_out
          ffmpeg -y -hide_banner -loglevel error -f lavfi -i "sine=frequency=440:duration=5" \
            -ac 2 -ar 44100 /tmp/dmx_ci_in/tone5s.mp3
          app/dist/DemucsOnnxMac.app/Contents/MacOS/DemucsOnnxMac \
            --headless /tmp/dmx_ci_in/tone5s.mp3 --out /tmp/dmx_ci_out --mp3
          for s in drums bass other vocals guitar piano; do
            test -f "/tmp/dmx_ci_out/tone5s/${s}.mp3"
          done
          ls -la /tmp/dmx_ci_out/tone5s/

      - name: Prepare zip artifact
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp app/dist/demucs-onnx-mac-x64.zip release-assets/
          (
            cd release-assets
            shasum -a 256 demucs-onnx-mac-x64.zip | tee demucs-onnx-mac-x64.zip.sha256
          )

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: demucs-onnx-mac-x64.zip
          path: release-assets/*
          if-no-files-found: error

      - name: Setup butler
        if: github.event.inputs.publish_itch == 'true'
        uses: remarkablegames/setup-butler@v2
        with:
          butler-version: LATEST

      - name: Push to itch.io (Mac Intel ONNX)
        if: github.event.inputs.publish_itch == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BUTLER_API_KEY:-}" ]; then
            echo "ERROR: BUTLER_API_KEY secret is not set" >&2
            exit 1
          fi
          butler push release-assets/demucs-onnx-mac-x64.zip \
            "${ITCH_USER}/${ITCH_GAME}:onnx-mac-intel" \
            --userversion "${VERSION}"
          echo "Pushed to itch.io ${ITCH_USER}/${ITCH_GAME}:onnx-mac-intel @ ${VERSION}"

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: read-version
    if: contains(fromJSON('["linux","all"]'), github.event.inputs.build_platform)
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      VERSION: ${{ needs.read-version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      DMX_VARIANT: onnx
    steps:
      - name: Block re-runs
        if: github.run_attempt != 1
        shell: bash
        run: |
          echo "::error::Re-runs are disabled (attempt ${{ github.run_attempt }}). Dispatch a new run instead." >&2
          exit 1

      - name: Checkout demucs-ui-app
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -o Acquire::ForceIPv4=true -o DPkg::Lock::Timeout=120
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config zip unzip \
            libvorbis-dev libogg-dev zlib1g-dev \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev libxkbcommon-dev \
            ffmpeg

      - name: Wire externals (raylib + vgmstream source)
        run: |
          set -euo pipefail
          chmod +x app/scripts/*.sh
          bash app/scripts/vendor_vgmstream.sh
          bash app/scripts/setup_externals.sh

      - name: Build GUI (CMake Release)
        run: make -C app build DMX_VARIANT=onnx

      - name: Smoke --version
        run: |
          set -euo pipefail
          BIN="app/build/DemucsOnnxLinux"
          test -x "$BIN"
          "$BIN" --version
          "$BIN" --version | grep -F "${VERSION}"

      - name: Fetch pinned ONNX worker
        run: |
          set -euo pipefail
          bash app/scripts/fetch_onnx_worker.sh linux-x64
          test -x app/dist/worker/demucs_onnx_worker/demucs_onnx_worker
          test -f app/models/htdemucs_6s_fp16weights.onnx

      - name: Package Linux zip
        run: |
          set -euo pipefail
          bash app/scripts/build_linux.sh
          test -f app/dist/demucs-onnx-linux-x64.zip

      - name: Smoke bundled app headless (5s tone -> 6 stems)
        timeout-minutes: 30
        run: |
          set -euo pipefail
          mkdir -p /tmp/dmx_ci_in /tmp/dmx_ci_out
          ffmpeg -y -hide_banner -loglevel error -f lavfi -i "sine=frequency=440:duration=5" \
            -ac 2 -ar 44100 /tmp/dmx_ci_in/tone5s.mp3
          app/dist/DemucsOnnxLinux/DemucsOnnxLinux \
            --headless /tmp/dmx_ci_in/tone5s.mp3 --out /tmp/dmx_ci_out --mp3
          for s in drums bass other vocals guitar piano; do
            test -f "/tmp/dmx_ci_out/tone5s/${s}.mp3"
          done
          ls -la /tmp/dmx_ci_out/tone5s/

      - name: Prepare zip artifact
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp app/dist/demucs-onnx-linux-x64.zip release-assets/
          (
            cd release-assets
            sha256sum demucs-onnx-linux-x64.zip | tee demucs-onnx-linux-x64.zip.sha256
          )

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: demucs-onnx-linux-x64.zip
          path: release-assets/*
          if-no-files-found: error

      - name: Setup butler
        if: github.event.inputs.publish_itch == 'true'
        uses: remarkablegames/setup-butler@v2
        with:
          butler-version: LATEST

      - name: Push to itch.io (Linux ONNX)
        if: github.event.inputs.publish_itch == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BUTLER_API_KEY:-}" ]; then
            echo "ERROR: BUTLER_API_KEY secret is not set" >&2
            exit 1
          fi
          butler push release-assets/demucs-onnx-linux-x64.zip \
            "${ITCH_USER}/${ITCH_GAME}:onnx-linux" \
            --userversion "${VERSION}"
          echo "Pushed to itch.io ${ITCH_USER}/${ITCH_GAME}:onnx-linux @ ${VERSION}"

  build-windows-onnx:
    # Standard Windows download: one DirectML ONNX zip (NVIDIA, AMD, Intel, and CPU).
    runs-on: windows-latest
    timeout-minutes: 45
    needs: read-version
    if: contains(fromJSON('["windows","all"]'), github.event.inputs.build_platform)
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      VERSION: ${{ needs.read-version.outputs.version }}
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      GH_TOKEN: ${{ github.token }}
      DMX_VARIANT: onnx
    steps:
      - name: Block re-runs
        if: github.run_attempt != 1
        shell: bash
        run: |
          echo "::error::Re-runs are disabled (attempt ${{ github.run_attempt }}). Dispatch a new run instead." >&2
          exit 1

      - name: Checkout demucs-ui-app
        uses: actions/checkout@v4

      - name: Clone and bootstrap vcpkg
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "%GITHUB_WORKSPACE%\vcpkg"
          call "%GITHUB_WORKSPACE%\vcpkg\bootstrap-vcpkg.bat"

      - name: Restore vcpkg downloads and installed trees
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg/downloads
            ${{ github.workspace }}/vcpkg/installed
          key: vcpkg-${{ runner.os }}-x64-dmx-static-v1

      - name: Install vcpkg ports
        shell: cmd
        run: |
          "%GITHUB_WORKSPACE%\vcpkg\vcpkg.exe" install zlib:x64-windows-static libogg:x64-windows-static libvorbis:x64-windows-static
          if errorlevel 1 exit /b 1

      - name: Restore vgmstream checkout
        uses: actions/cache@v4
        with:
          path: app/external/rocksmith-psarc-src/external/vgmstream
          key: vgmstream-${{ hashFiles('app/scripts/vendor_vgmstream.sh') }}

      - name: Wire externals (raylib + vgmstream)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x app/scripts/*.sh
          bash app/scripts/setup_externals.sh

      - name: Configure and build GUI (CMake Release, MSVC + vcpkg)
        shell: cmd
        working-directory: app
        run: |
          set "TOOLCHAIN=%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake"
          cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=%TOOLCHAIN% -DVCPKG_TARGET_TRIPLET=x64-windows-static -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DDMX_VARIANT=onnx -A x64
          if errorlevel 1 exit /b 1
          cmake --build build --config Release --parallel -- /verbosity:minimal /nologo
          if errorlevel 1 exit /b 1

      - name: Smoke --version
        shell: bash
        run: |
          set -euo pipefail
          EXE="app/build/Release/DemucsOnnxWindows.exe"
          test -f "$EXE"
          "$EXE" --version
          "$EXE" --version | grep -F "${VERSION}"

      - name: Assert GUI is /MT (no VC++ redist DLLs)
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -find "**\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) { Write-Error "dumpbin.exe not found"; exit 1 }
          $exe = "app\build\Release\DemucsOnnxWindows.exe"
          $deps = & $dumpbin /DEPENDENTS $exe | Out-String
          Write-Host $deps
          foreach ($dll in @("VCRUNTIME140.dll", "VCRUNTIME140_1.dll", "MSVCP140.dll", "MSVCP140_1.dll", "MSVCP140_2.dll")) {
            if ($deps -match [regex]::Escape($dll)) {
              Write-Error "DemucsOnnxWindows.exe still depends on $dll; expected static /MT"
              exit 1
            }
          }

      - name: Fetch pinned ONNX worker
        shell: bash
        run: |
          set -euo pipefail
          bash app/scripts/fetch_onnx_worker.sh windows-x64
          test -f app/dist/worker/demucs_onnx_worker/demucs_onnx_worker.exe
          test -f app/models/htdemucs_6s_fp16weights.onnx

      - name: Package Windows zip
        shell: pwsh
        run: |
          $env:DMX_VARIANT = "onnx"
          pwsh -File app/scripts/build_windows.ps1
          if (-not (Test-Path "app/dist/demucs-onnx-windows.zip")) { exit 1 }

      - name: Install ffmpeg
        shell: cmd
        run: choco install ffmpeg --no-progress -y

      - name: Smoke bundled app headless (5s tone -> 6 stems)
        timeout-minutes: 30
        shell: pwsh
        run: |
          $in = Join-Path $env:TEMP "dmx_ci_in"
          $out = Join-Path $env:TEMP "dmx_ci_out"
          New-Item -ItemType Directory -Force -Path $in, $out | Out-Null
          ffmpeg -y -hide_banner -loglevel error -f lavfi -i "sine=frequency=440:duration=5" -ac 2 -ar 44100 "$in\tone5s.mp3"
          & "app\dist\DemucsOnnxWindows\DemucsOnnxWindows.exe" --headless "$in\tone5s.mp3" --out $out --mp3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($s in @("drums","bass","other","vocals","guitar","piano")) {
            $p = Join-Path $out "tone5s\$s.mp3"
            if (-not (Test-Path $p)) { Write-Error "missing $p"; exit 1 }
          }
          Get-ChildItem "$out\tone5s"

      - name: Prepare zip artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp app/dist/demucs-onnx-windows.zip release-assets/
          (
            cd release-assets
            sha256sum demucs-onnx-windows.zip | tee demucs-onnx-windows.zip.sha256
          )

      - name: Upload Windows ONNX zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: demucs-onnx-windows.zip
          path: release-assets/*
          if-no-files-found: error

      - name: Setup butler
        if: github.event.inputs.publish_itch == 'true'
        uses: remarkablegames/setup-butler@v2
        with:
          butler-version: LATEST

      - name: Push to itch.io (Windows ONNX)
        if: github.event.inputs.publish_itch == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BUTLER_API_KEY:-}" ]; then
            echo "ERROR: BUTLER_API_KEY secret is not set" >&2
            exit 1
          fi
          butler push release-assets/demucs-onnx-windows.zip \
            "${ITCH_USER}/${ITCH_GAME}:onnx-windows" \
            --userversion "${VERSION}"
          echo "Pushed to itch.io ${ITCH_USER}/${ITCH_GAME}:onnx-windows @ ${VERSION}"

  build-windows:
    # Optional torch zip. Not part of `windows` or `all`.
    runs-on: windows-latest
    timeout-minutes: 40
    needs: read-version
    if: contains(fromJSON('["windows-torch"]'), github.event.inputs.build_platform)
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      VERSION: ${{ needs.read-version.outputs.version }}
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      DMX_VARIANT: torch
    steps:
      - name: Block re-runs
        if: github.run_attempt != 1
        shell: bash
        run: |
          echo "::error::Re-runs are disabled (attempt ${{ github.run_attempt }}). Dispatch a new run instead." >&2
          exit 1

      - name: Checkout demucs-ui-app
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Clone and bootstrap vcpkg
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "%GITHUB_WORKSPACE%\vcpkg"
          call "%GITHUB_WORKSPACE%\vcpkg\bootstrap-vcpkg.bat"

      - name: Restore vcpkg downloads and installed trees
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg/downloads
            ${{ github.workspace }}/vcpkg/installed
          key: vcpkg-${{ runner.os }}-x64-dmx-static-v1

      - name: Install vcpkg ports
        shell: cmd
        run: |
          "%GITHUB_WORKSPACE%\vcpkg\vcpkg.exe" install zlib:x64-windows-static libogg:x64-windows-static libvorbis:x64-windows-static
          if errorlevel 1 exit /b 1

      - name: Restore vgmstream checkout
        uses: actions/cache@v4
        with:
          path: app/external/rocksmith-psarc-src/external/vgmstream
          key: vgmstream-${{ hashFiles('app/scripts/vendor_vgmstream.sh') }}

      - name: Wire externals (raylib + vgmstream)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x app/scripts/*.sh
          bash app/scripts/setup_externals.sh

      - name: Configure and build GUI (CMake Release, MSVC + vcpkg)
        shell: cmd
        working-directory: app
        run: |
          set "TOOLCHAIN=%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake"
          cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=%TOOLCHAIN% -DVCPKG_TARGET_TRIPLET=x64-windows-static -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DDMX_VARIANT=torch -A x64
          if errorlevel 1 exit /b 1
          cmake --build build --config Release --parallel -- /verbosity:minimal /nologo
          if errorlevel 1 exit /b 1

      - name: Smoke --version
        shell: bash
        run: |
          set -euo pipefail
          EXE="app/build/Release/DemucsTorchWindows.exe"
          test -f "$EXE"
          "$EXE" --version
          "$EXE" --version | grep -F "${VERSION}"

      - name: Assert GUI is /MT (no VC++ redist DLLs)
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -find "**\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) { Write-Error "dumpbin.exe not found"; exit 1 }
          $exe = "app\build\Release\DemucsTorchWindows.exe"
          $deps = & $dumpbin /DEPENDENTS $exe | Out-String
          Write-Host $deps
          foreach ($dll in @("VCRUNTIME140.dll", "VCRUNTIME140_1.dll", "MSVCP140.dll", "MSVCP140_1.dll", "MSVCP140_2.dll")) {
            if ($deps -match [regex]::Escape($dll)) {
              Write-Error "DemucsTorchWindows.exe still depends on $dll; expected static /MT"
              exit 1
            }
          }

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install CUDA torch + Demucs + freeze deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.2.2 torchaudio==2.2.2 --index-url https://download.pytorch.org/whl/cu121
          python -m pip install -r workers/demucs-windows/requirements-windows.txt
          $env:PYTHONPATH = (Join-Path (Get-Location) "workers\demucs-windows")

      - name: Restore Demucs torch checkpoint cache
        uses: actions/cache@v4
        id: torch-model-cache
        with:
          path: |
            workers/demucs-windows/models/torch
            workers/demucs-windows/models/hf
          key: htdemucs-6s-torch-hf-${{ hashFiles('workers/demucs-windows/requirements-windows.txt', 'workers/demucs-windows/demucs_torch/separate.py') }}

      - name: Prefetch official Demucs weights
        if: steps.torch-model-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $env:DEMUCS_TORCH_PYTHON = (Get-Command python).Source
          pwsh -File workers/demucs-windows/scripts/prefetch_torch_models.ps1

      - name: Freeze torch worker (PyInstaller)
        shell: pwsh
        run: |
          $env:DEMUCS_TORCH_PYTHON = (Get-Command python).Source
          $env:PYTHONPATH = (Join-Path (Get-Location) "workers\demucs-windows")
          pwsh -File workers/demucs-windows/scripts/freeze_worker_torch.ps1
          New-Item -ItemType Directory -Force -Path app/dist/worker | Out-Null
          Copy-Item -Recurse -Force workers/demucs-windows/dist/worker/demucs_torch_worker app/dist/worker/
          Copy-Item -Recurse -Force workers/demucs-windows/models app/models

      - name: Package Windows zip
        id: package
        shell: pwsh
        run: |
          $env:DMX_VARIANT = "torch"
          pwsh -File app/scripts/build_windows.ps1
          if (-not (Test-Path "app/dist/demucs-torch-windows.zip")) { exit 1 }

      - name: Install ffmpeg
        shell: cmd
        run: choco install ffmpeg --no-progress -y

      - name: Smoke bundled app headless (5s tone -> 6 stems, CPU)
        timeout-minutes: 30
        shell: pwsh
        env:
          DEMUCS_DEVICE: cpu
        run: |
          $in = Join-Path $env:TEMP "dmx_ci_in"
          $out = Join-Path $env:TEMP "dmx_ci_out"
          New-Item -ItemType Directory -Force -Path $in, $out | Out-Null
          ffmpeg -y -hide_banner -loglevel error -f lavfi -i "sine=frequency=440:duration=5" -ac 2 -ar 44100 "$in\tone5s.mp3"
          $env:DEMUCS_DEVICE = "cpu"
          & "app\dist\DemucsTorchWindows\DemucsTorchWindows.exe" --headless "$in\tone5s.mp3" --out $out --mp3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($s in @("drums","bass","other","vocals","guitar","piano")) {
            $p = Join-Path $out "tone5s\$s.mp3"
            if (-not (Test-Path $p)) { Write-Error "missing $p"; exit 1 }
          }
          Get-ChildItem "$out\tone5s"

      - name: Prepare zip artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp app/dist/demucs-torch-windows.zip release-assets/
          (
            cd release-assets
            sha256sum demucs-torch-windows.zip | tee demucs-torch-windows.zip.sha256
          )

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: demucs-torch-windows.zip
          path: release-assets/*
          if-no-files-found: error

      - name: Setup butler
        if: github.event.inputs.publish_itch == 'true'
        uses: remarkablegames/setup-butler@v2
        with:
          butler-version: LATEST

      - name: Push to itch.io (Windows)
        if: github.event.inputs.publish_itch == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BUTLER_API_KEY:-}" ]; then
            echo "ERROR: BUTLER_API_KEY secret is not set" >&2
            exit 1
          fi
          butler push release-assets/demucs-torch-windows.zip \
            "${ITCH_USER}/${ITCH_GAME}:torch-windows" \
            --userversion "${VERSION}"
          echo "Pushed to itch.io ${ITCH_USER}/${ITCH_GAME}:torch-windows @ ${VERSION}"

  build-windows-cuda:
    # GUI + pinned demucs-cuda worker. Hosted runners have no NVIDIA GPU, so this
    # job does not run stem-separation smoke. Included in `all` so itch-dev
    # (demucs-app-dev) gets the cuda-windows channel.
    runs-on: windows-latest
    timeout-minutes: 40
    needs: read-version
    if: contains(fromJSON('["windows-cuda","all"]'), github.event.inputs.build_platform)
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      VERSION: ${{ needs.read-version.outputs.version }}
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      DMX_VARIANT: cuda
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Block re-runs
        if: github.run_attempt != 1
        shell: bash
        run: |
          echo "::error::Re-runs are disabled (attempt ${{ github.run_attempt }}). Dispatch a new run instead." >&2
          exit 1

      - name: Checkout demucs-ui-app
        uses: actions/checkout@v4

      - name: Clone and bootstrap vcpkg
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "%GITHUB_WORKSPACE%\vcpkg"
          call "%GITHUB_WORKSPACE%\vcpkg\bootstrap-vcpkg.bat"

      - name: Restore vcpkg downloads and installed trees
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg/downloads
            ${{ github.workspace }}/vcpkg/installed
          key: vcpkg-${{ runner.os }}-x64-dmx-static-v1

      - name: Install vcpkg ports
        shell: cmd
        run: |
          "%GITHUB_WORKSPACE%\vcpkg\vcpkg.exe" install zlib:x64-windows-static libogg:x64-windows-static libvorbis:x64-windows-static
          if errorlevel 1 exit /b 1

      - name: Restore vgmstream checkout
        uses: actions/cache@v4
        with:
          path: app/external/rocksmith-psarc-src/external/vgmstream
          key: vgmstream-${{ hashFiles('app/scripts/vendor_vgmstream.sh') }}

      - name: Wire externals (raylib + vgmstream)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x app/scripts/*.sh
          bash app/scripts/setup_externals.sh

      - name: Configure and build GUI (CMake Release, MSVC + vcpkg)
        shell: cmd
        working-directory: app
        run: |
          set "TOOLCHAIN=%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake"
          cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=%TOOLCHAIN% -DVCPKG_TARGET_TRIPLET=x64-windows-static -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DDMX_VARIANT=cuda -A x64
          if errorlevel 1 exit /b 1
          cmake --build build --config Release --parallel -- /verbosity:minimal /nologo
          if errorlevel 1 exit /b 1

      - name: Smoke --version
        shell: bash
        run: |
          set -euo pipefail
          EXE="app/build/Release/DemucsCudaWindows.exe"
          test -f "$EXE"
          "$EXE" --version
          "$EXE" --version | grep -F "${VERSION}"

      - name: Assert GUI is /MT (no VC++ redist DLLs)
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -find "**\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) { Write-Error "dumpbin.exe not found"; exit 1 }
          $exe = "app\build\Release\DemucsCudaWindows.exe"
          $deps = & $dumpbin /DEPENDENTS $exe | Out-String
          Write-Host $deps
          foreach ($dll in @("VCRUNTIME140.dll", "VCRUNTIME140_1.dll", "MSVCP140.dll", "MSVCP140_1.dll", "MSVCP140_2.dll")) {
            if ($deps -match [regex]::Escape($dll)) {
              Write-Error "DemucsCudaWindows.exe still depends on $dll; expected static /MT"
              exit 1
            }
          }

      - name: Fetch pinned CUDA worker
        shell: bash
        run: |
          set -euo pipefail
          bash app/scripts/fetch_cuda_worker.sh
          test -f app/dist/worker/demucs_cuda_worker.exe
          test -f app/models/htdemucs_6s.fp16.safetensors
          test -f app/models/htdemucs_6s.json

      - name: Package Windows zip
        shell: pwsh
        run: |
          $env:DMX_VARIANT = "cuda"
          pwsh -File app/scripts/build_windows.ps1
          if (-not (Test-Path "app/dist/demucs-cuda-windows.zip")) { exit 1 }

      - name: Smoke packaged worker (no GPU)
        shell: pwsh
        run: |
          $exe = "app\dist\DemucsCudaWindows\worker\demucs_cuda_worker.exe"
          $weights = "app\dist\DemucsCudaWindows\models\htdemucs_6s.fp16.safetensors"
          $json = "app\dist\DemucsCudaWindows\models\htdemucs_6s.json"
          if (-not (Test-Path $exe)) { Write-Error "missing $exe"; exit 1 }
          if (-not (Test-Path $weights)) { Write-Error "missing $weights"; exit 1 }
          if (-not (Test-Path $json)) { Write-Error "missing $json"; exit 1 }
          & $exe --list-models
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare zip artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp app/dist/demucs-cuda-windows.zip release-assets/
          (
            cd release-assets
            sha256sum demucs-cuda-windows.zip | tee demucs-cuda-windows.zip.sha256
          )

      - name: Upload Windows CUDA zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: demucs-cuda-windows.zip
          path: release-assets/*
          if-no-files-found: error

      - name: Setup butler
        if: github.event.inputs.publish_itch == 'true'
        uses: remarkablegames/setup-butler@v2
        with:
          butler-version: LATEST

      - name: Push to itch.io (Windows CUDA)
        if: github.event.inputs.publish_itch == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BUTLER_API_KEY:-}" ]; then
            echo "ERROR: BUTLER_API_KEY secret is not set" >&2
            exit 1
          fi
          butler push release-assets/demucs-cuda-windows.zip \
            "${ITCH_USER}/${ITCH_GAME}:cuda-windows" \
            --userversion "${VERSION}"
          echo "Pushed to itch.io ${ITCH_USER}/${ITCH_GAME}:cuda-windows @ ${VERSION}"

  publish-gh-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [read-version, build-macos, build-macos-intel, build-linux, build-windows, build-windows-onnx, build-windows-cuda]
    if: >-
      github.event.inputs.publish_gh_release == 'true' &&
      !cancelled() &&
      (needs.build-macos.result == 'success' ||
       needs.build-macos.result == 'skipped') &&
      (needs.build-macos-intel.result == 'success' ||
       needs.build-macos-intel.result == 'skipped') &&
      (needs.build-linux.result == 'success' ||
       needs.build-linux.result == 'skipped') &&
      (needs.build-windows.result == 'success' ||
       needs.build-windows.result == 'skipped') &&
      (needs.build-windows-onnx.result == 'success' ||
       needs.build-windows-onnx.result == 'skipped') &&
      (needs.build-windows-cuda.result == 'success' ||
       needs.build-windows-cuda.result == 'skipped') &&
      (needs.build-macos.result == 'success' ||
       needs.build-macos-intel.result == 'success' ||
       needs.build-linux.result == 'success' ||
       needs.build-windows.result == 'success' ||
       needs.build-windows-onnx.result == 'success' ||
       needs.build-windows-cuda.result == 'success')
    env:
      TAG: ${{ needs.read-version.outputs.tag }}
      VERSION: ${{ needs.read-version.outputs.version }}
    steps:
      - name: Block re-runs
        if: github.run_attempt != 1
        shell: bash
        run: |
          echo "::error::Re-runs are disabled (attempt ${{ github.run_attempt }}). Dispatch a new run instead." >&2
          exit 1

      - uses: actions/checkout@v4

      - name: Guard duplicate tag
        run: |
          set -euo pipefail
          git fetch --tags origin
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "ERROR: Tag ${TAG} already exists; bump VERSION in project.conf" >&2
            exit 1
          fi
          echo "Tag ${TAG} is available"

      - name: Download zip artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: demucs-*.zip
          path: release-assets
          merge-multiple: true

      - name: Drop Windows zips if over GitHub 2GB asset cap
        if: needs.build-windows.result == 'success' || needs.build-windows-onnx.result == 'success' || needs.build-windows-cuda.result == 'success'
        run: |
          set -euo pipefail
          for WIN in release-assets/demucs-torch-windows.zip release-assets/demucs-onnx-windows.zip release-assets/demucs-cuda-windows.zip; do
            if [ -f "$WIN" ]; then
              BYTES=$(stat -c%s "$WIN")
              if [ "$BYTES" -ge 2147483648 ]; then
                echo "${WIN} is ${BYTES} bytes (>= 2 GiB). Skipping GitHub Release asset; itch.io is the storefront."
                rm -f "$WIN" "${WIN}.sha256"
              fi
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Demucs ${{ env.TAG }}
          generate_release_notes: true
          body: |
            ## Downloads
            - **macOS Apple Silicon:** `demucs-mlx-c-arm-mac-silicon.zip` (native C + Metal). `demucs-mlx-py-arm-mac-silicon.zip` is the Python MLX build.
            - **macOS Intel:** `demucs-onnx-mac-x64.zip` (ONNX Runtime CPU)
            - **Windows x64:** `demucs-onnx-windows.zip` (ONNX DirectML: NVIDIA, AMD, Intel, and CPU)
            - **Linux x64:** `demucs-onnx-linux-x64.zip` (ONNX Runtime CPU)
            - **Windows CUDA (optional):** `demucs-cuda-windows.zip`
            - **Windows torch (optional):** `demucs-torch-windows.zip` (omitted here if over 2 GB — use itch.io)

            Also on itch.io: https://nicapotato.itch.io/demucs-app-dev
            Channels: `mlx-c-arm-mac-silicon`, `mlx-py-arm-mac-silicon`, `onnx-mac-intel`, `onnx-windows`, `onnx-linux`, `cuda-windows`, `torch-windows`
          files: |
            release-assets/*
